<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pages 公開テスト</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #667085;
      --line: #e4e7ec;
      --ok: #12865a;
      --ok-bg: #e7f6ef;
      --warn: #b54708;
      --warn-bg: #fef3e7;
      --accent: #f38020;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b;
        --card: #1b2029;
        --text: #e6e9ef;
        --muted: #98a2b3;
        --line: #2b3240;
        --ok: #4ade80;
        --ok-bg: #15301f;
        --warn: #fbbf24;
        --warn-bg: #33270f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.6;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px 28px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ok);
      background: var(--ok-bg);
      padding: 4px 12px;
      border-radius: 999px;
    }
    .badge::before {
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    h1 {
      font-size: 26px;
      margin: 16px 0 4px;
      letter-spacing: -0.01em;
    }
    p.lead { margin: 0 0 24px; color: var(--muted); }
    dl { margin: 0; border-top: 1px solid var(--line); }
    .row {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }
    dt { color: var(--muted); }
    dd { margin: 0; word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .ok { color: var(--ok); font-weight: 600; }
    .warn { color: var(--warn); font-weight: 600; }
    .note {
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
      background: var(--bg);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .note.warn-box { color: var(--warn); background: var(--warn-bg); }
    footer { margin-top: 20px; font-size: 12px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">公開中</span>
    <h1>Hello, GitHub Pages!</h1>
    <p class="lead">このページが表示されていれば、デプロイは成功しています。</p>

    <dl>
      <div class="row"><dt>ドメイン</dt><dd id="host">-</dd></div>
      <div class="row"><dt>接続</dt><dd id="proto">-</dd></div>
      <div class="row"><dt>URL</dt><dd id="url">-</dd></div>
      <div class="row"><dt>表示時刻</dt><dd id="time">-</dd></div>
      <div class="row"><dt>ページ更新</dt><dd id="build">2026-10-19</dd></div>
    </dl>

    <div class="note" id="note"></div>

    <footer>Hosted on GitHub Pages · DNS by Cloudflare</footer>
  </main>

  <script>
    const host = location.hostname;
    const https = location.protocol === "https:";

    document.getElementById("host").textContent = host;
    document.getElementById("url").textContent = location.href;
    document.getElementById("time").textContent = new Date().toLocaleString("ja-JP");

    const proto = document.getElementById("proto");
    proto.textContent = https ? "HTTPS（暗号化あり）" : "HTTP（暗号化なし）";
    proto.className = https ? "ok" : "warn";

    const note = document.getElementById("note");
    if (host.endsWith("github.io")) {
      note.textContent = "github.io のURLで表示中です。カスタムドメインの設定後は、そちらのURLでもアクセスして確認してください。";
    } else if (!https) {
      note.textContent = "カスタムドメインで表示できています。HTTPSになっていない場合は、証明書の発行を待ってから GitHub の Pages 設定で「Enforce HTTPS」を有効にしてください。";
      note.classList.add("warn-box");
    } else {
      note.textContent = "カスタムドメイン＋HTTPSで表示できています。設定は完了です 🎉";
    }
  </script>
</body>
</html>
